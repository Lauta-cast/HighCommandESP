
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detector de humo</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
    display: grid;
    place-items: center;
    min-height: 100vh;
  }

  .panel {
    background: #1e293b;
    padding: 35px;
    border-radius: 20px;
    text-align: center;
    width: min(85%, 380px);
  }

  h1 { font-size: 27px; }

  #estado {
    font-size: 27px;
    font-weight: bold;
    margin: 30px 0;
  }

  #lectura {
    color: #cbd5e1;
    font-size: 19px;
  }

  button {
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 14px 20px;
    font-size: 16px;
    cursor: pointer;
    margin: 5px;
  }

  .alarma {
    background: #7f1d1d;
    animation: parpadeo 0.7s infinite alternate;
  }

  @keyframes parpadeo {
    from { background: #7f1d1d; }
    to { background: #dc2626; }
  }
</style>
</head>

<body>
<div class="panel" id="panel">
  <h1>Detector de humo</h1>

  <p id="conexion">Bluetooth desconectado</p>

  <button id="conectar">Conectar ESP32</button>
  <button id="silenciar">Silenciar alarma</button>

  <div id="estado">Esperando conexión</div>

  <p id="lectura">Lectura: --</p>
  <p id="umbral">Umbral de detección: 900</p>
</div>

<script>
const SERVICE_UUID =
  "12345678-1234-1234-1234-123456789000";

const CHARACTERISTIC_UUID =
  "12345678-1234-1234-1234-123456789001";

const UMBRAL_HUMO = 900;

let audioContext = null;
let oscilador = null;
let ganancia = null;
let alarmaSilenciada = false;
let humoAnterior = false;

async function conectar() {
  try {
    // El navegador exige una interacción del usuario
    audioContext = new (window.AudioContext ||
                       window.webkitAudioContext)();

    await audioContext.resume();

    const dispositivo =
      await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_UUID]
      });

    dispositivo.addEventListener("gattserverdisconnected", () => {
      document.getElementById("conexion").textContent =
        "Bluetooth desconectado";

      detenerAlarma();
    });

    const servidor = await dispositivo.gatt.connect();

    const servicio =
      await servidor.getPrimaryService(SERVICE_UUID);

    const caracteristica =
      await servicio.getCharacteristic(
        CHARACTERISTIC_UUID
      );

    document.getElementById("conexion").textContent =
      "Bluetooth conectado";

    async function actualizar() {
      try {
        const dato = await caracteristica.readValue();

        const texto = new TextDecoder().decode(dato);
        const partes = texto.split(",");

        const valor = Number(partes[0]);

        if (!Number.isFinite(valor)) return;

        // La decisión se toma exclusivamente en la página
        const humo = valor >= UMBRAL_HUMO;

        document.getElementById("lectura").textContent =
          "Lectura del sensor: " + valor;

        const estado = document.getElementById("estado");
        const panel = document.getElementById("panel");

        if (humo) {
          estado.textContent = "¡HUMO DETECTADO!";
          estado.style.color = "#f87171";
          panel.classList.add("alarma");

          if (!humoAnterior && !alarmaSilenciada) {
            iniciarAlarma();
          }

        } else {
          estado.textContent = "SIN DETECCIÓN";
          estado.style.color = "#4ade80";
          panel.classList.remove("alarma");

          alarmaSilenciada = false;
          detenerAlarma();
        }

        humoAnterior = humo;

      } catch (error) {
        document.getElementById("conexion").textContent =
          "Error leyendo el sensor";
        detenerAlarma();
      }
    }

    await actualizar();
    window.lecturaIntervalo =
      setInterval(actualizar, 1000);

  } catch (error) {
    document.getElementById("conexion").textContent =
      "No se pudo conectar: " + error.message;
  }
}

function iniciarAlarma() {
  if (!audioContext || oscilador) return;

  oscilador = audioContext.createOscillator();
  ganancia = audioContext.createGain();

  oscilador.type = "square";
  oscilador.frequency.value = 850;
  ganancia.gain.value = 0.12;

  oscilador.connect(ganancia);
  ganancia.connect(audioContext.destination);

  oscilador.start();
}

function detenerAlarma() {
  if (oscilador) {
    oscilador.stop();
    oscilador.disconnect();
    ganancia.disconnect();

    oscilador = null;
    ganancia = null;
  }
}

document.getElementById("conectar").addEventListener(
  "click", conectar
);

document.getElementById("silenciar").addEventListener(
  "click", () => {
    alarmaSilenciada = true;
    detenerAlarma();
  }
);
</script>
</body>
</html>
